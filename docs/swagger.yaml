basePath: /api
definitions:
  dto.LoginRequest:
    properties:
      password:
        description: 密码
        example: "123456"
        type: string
      userName:
        description: 用户名
        example: admin
        type: string
    required:
    - password
    - userName
    type: object
  dto.LoginResponse:
    properties:
      token:
        description: 用户token
        example: abc123
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      token:
        description: 用户token
        example: abc123
        type: string
    required:
    - token
    type: object
  dto.MediaConfigPageResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/dto.MediaConfigResponse'
        type: array
      total:
        type: integer
    type: object
  dto.MediaConfigResponse:
    properties:
      code:
        type: string
      id:
        type: integer
      media_desc:
        type: string
      name:
        type: string
      status:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  dto.ModelsInfoResponse:
    properties:
      algorithm:
        description: 算法
        type: string
      classify:
        description: 分类
        type: string
      date_time:
        description: 日期时间
        type: string
      description:
        description: 描述
        type: string
      id:
        description: 模型ID
        type: integer
      name:
        description: 模型名称
        type: string
      sophon_type:
        description: Sophon类型
        type: integer
      specialty:
        description: 专业性
        type: integer
    type: object
  dto.NetworkConfigResponse:
    properties:
      bandwidth:
        description: 带宽，如"100Mb/s"
        type: string
      bandwidth_varity:
        description: 带宽变化
        type: boolean
      device:
        description: 网络设备，如"eth0"
        type: string
      dns:
        description: DNS服务器
        type: string
      gateway:
        description: 网关地址
        type: string
      ip:
        description: IP地址
        type: string
      mac:
        description: MAC地址
        type: string
      netmask:
        description: 子网掩码
        type: string
      status:
        description: 网络状态：static/dynamic
        type: string
    type: object
  dto.SaveAlarmCategoryRequest:
    properties:
      alarm_desc:
        description: 告警描述
        type: string
      alarm_type:
        description: 告警类别
        type: string
      arithmetic:
        description: 所属算法
        type: string
      audio_file:
        description: 语音文件
        type: string
      sophon_type:
        description: Sophon类型
        type: integer
    required:
    - alarm_type
    - arithmetic
    type: object
  dto.SaveAlarmManageRequest:
    properties:
      alarm_detail:
        type: string
      alarm_task:
        type: string
      alarm_type:
        type: string
      alarm_video:
        type: string
      img:
        type: string
      init_img:
        type: string
      media_id:
        type: integer
      media_url:
        type: string
      report_addr:
        type: string
      report_status:
        type: integer
      tm:
        type: string
      video_media:
        type: string
    required:
    - alarm_task
    type: object
  dto.SaveDeviceListRequest:
    properties:
      face_device:
        description: 是否为人脸设备
        type: integer
      ip_address:
        description: IP地址
        type: string
      last_used_tm:
        description: 最后使用时间
        type: string
      status:
        description: 设备状态
        type: integer
    required:
    - ip_address
    type: object
  dto.SaveMediaConfigRequest:
    properties:
      code:
        description: 编码
        example: CAM001
        type: string
      media_desc:
        description: 媒体描述
        example: 前门摄像头
        type: string
      name:
        description: 媒体名称
        example: 摄像头1
        type: string
      status:
        description: 状态
        example: active
        type: string
      type:
        description: 类型
        example: camera
        type: string
      url:
        description: 媒体URL
        example: rtsp://...
        type: string
    required:
    - name
    - url
    type: object
  dto.SaveModelsInfoRequest:
    properties:
      algorithm:
        description: 算法
        example: face_detection
        type: string
      classify:
        description: 分类
        example: 人脸识别
        type: string
      date_time:
        description: 日期时间
        example: "2024-01-01 12:00:00"
        type: string
      description:
        description: 描述
        example: 用于人脸识别的深度学习模型
        type: string
      name:
        description: 模型名称
        example: 人脸识别模型
        type: string
      sophon_type:
        description: Sophon类型
        example: 1
        type: integer
      specialty:
        description: 专业性
        example: 1
        type: integer
    required:
    - algorithm
    - name
    type: object
  dto.SaveParamConfRequest:
    properties:
      key:
        description: 配置键
        type: string
      param:
        description: 参数名称
        type: string
      param_value:
        description: 参数值
        type: string
    required:
    - key
    - param
    type: object
  dto.SavePlanTemplateRequest:
    properties:
      name:
        type: string
      plan:
        type: string
    required:
    - name
    - plan
    type: object
  dto.SaveTaskManageRequest:
    properties:
      alarm_interval:
        example: 30
        type: integer
      arit_params:
        example: '{"threshold":0.8}'
        type: string
      arithmetic_config:
        example: 人脸识别+行为分析
        type: string
      media_id:
        example: 1
        type: integer
      media_source:
        example: rtsp://192.168.1.100/stream
        type: string
      name:
        example: 监控任务1
        type: string
      plan_id:
        example: 1
        type: integer
      report_addr:
        example: http://192.168.1.200/api/alarm
        type: string
      sophon_types:
        example: 1,2,3
        type: string
      status_desc:
        example: 运行中
        type: string
      task_status:
        example: 1
        type: integer
      used_ip:
        example: 192.168.1.100
        type: string
      work_plan:
        example: 全天候监控
        type: string
    required:
    - name
    type: object
  dto.SaveThresholdConfRequest:
    properties:
      param_desc:
        description: 参数描述
        type: string
      param_value:
        description: 参数值
        type: number
      sophon_type:
        description: Sophon类型
        type: integer
    required:
    - param_desc
    type: object
  dto.UpdateAlarmManageRequest:
    properties:
      alarm_detail:
        type: string
      alarm_task:
        type: string
      alarm_type:
        type: string
      alarm_video:
        type: string
      id:
        type: integer
      img:
        type: string
      init_img:
        type: string
      media_id:
        type: integer
      media_url:
        type: string
      report_addr:
        type: string
      report_status:
        type: integer
      tm:
        type: string
      video_media:
        type: string
    required:
    - alarm_task
    - id
    type: object
  dto.UpdateMediaConfigRequest:
    properties:
      code:
        description: 编码
        example: CAM001
        type: string
      id:
        description: 媒体配置ID
        example: 1
        type: integer
      media_desc:
        description: 媒体描述
        example: 前门摄像头
        type: string
      name:
        description: 媒体名称
        example: 摄像头1
        type: string
      status:
        description: 状态
        example: active
        type: string
      type:
        description: 类型
        example: camera
        type: string
      url:
        description: 媒体URL
        example: rtsp://...
        type: string
    required:
    - id
    - name
    - url
    type: object
  dto.UpdatePlanTemplateRequest:
    properties:
      id:
        type: integer
      name:
        type: string
      plan:
        type: string
    required:
    - id
    - name
    - plan
    type: object
  dto.UpdateTaskManageRequest:
    properties:
      alarm_interval:
        type: integer
      arit_params:
        type: string
      arithmetic_config:
        type: string
      id:
        type: integer
      media_id:
        type: integer
      media_source:
        type: string
      name:
        type: string
      plan_id:
        type: integer
      report_addr:
        type: string
      sophon_types:
        type: string
      status_desc:
        type: string
      task_status:
        type: integer
      used_ip:
        type: string
      work_plan:
        type: string
    required:
    - id
    - name
    type: object
  handle.Response:
    properties:
      code:
        description: 响应码，0表示成功
        example: 0
        type: integer
      msg:
        description: 响应消息
        example: ok
        type: string
      result:
        description: 响应数据
        type: object
    type: object
  model.AlarmCategory:
    properties:
      alarm_desc:
        description: 告警描述
        type: string
      alarm_type:
        description: 告警类别
        type: string
      arithmetic:
        description: 所属算法
        type: string
      audio_file:
        description: 语音文件
        type: string
      id:
        type: integer
      sophon_type:
        description: Sophon类型
        type: integer
    type: object
  model.AlarmManage:
    properties:
      alarm_detail:
        type: string
      alarm_task:
        type: string
      alarm_type:
        type: string
      alarm_video:
        type: string
      id:
        type: integer
      img:
        type: string
      init_img:
        description: 原图
        type: string
      media_id:
        type: integer
      media_url:
        type: string
      report_addr:
        type: string
      report_status:
        type: integer
      tm:
        type: string
      video_media:
        type: string
    type: object
  model.DeviceList:
    properties:
      face_device:
        description: 是否为人脸设备：0否，1是
        type: integer
      id:
        type: integer
      ip_address:
