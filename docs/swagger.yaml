basePath: /api
definitions:
  dto.ChangePasswordRequest:
    properties:
      new_password:
        description: 新密码
        type: string
      old_password:
        description: 旧密码
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CreatePermissionRequest:
    properties:
      code:
        description: 权限编码
        type: string
      component:
        description: 组件路径
        type: string
      description:
        description: 权限描述
        type: string
      icon:
        description: 图标
        type: string
      name:
        description: 权限名称
        type: string
      parent_id:
        description: 父级ID
        type: integer
      path:
        description: 路由路径
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态：0-禁用，1-启用
        type: integer
      type:
        description: 权限类型：menu-菜单，button-按钮，api-接口
        type: string
    required:
    - code
    - name
    - type
    type: object
  dto.CreateRoleRequest:
    properties:
      code:
        description: 角色编码
        type: string
      description:
        description: 角色描述
        type: string
      name:
        description: 角色名称
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态：0-禁用，1-启用
        type: integer
    required:
    - code
    - name
    type: object
  dto.CreateUserRequest:
    properties:
      avatar:
        description: 头像
        type: string
      email:
        description: 邮箱
        type: string
      password:
        description: 密码
        type: string
      phone:
        description: 手机号
        type: string
      remark:
        description: 备注
        type: string
      role_ids:
        description: 角色ID列表
        items:
          type: integer
        type: array
      status:
        description: 状态：0-禁用，1-启用
        type: integer
      user_id:
        description: 用户ID
        type: string
      username:
        description: 用户名
        type: string
    required:
    - password
    - user_id
    - username
    type: object
  dto.LoginRequest:
    properties:
      password:
        description: 密码
        example: "123456"
        type: string
      userName:
        description: 用户名
        example: admin
        type: string
    required:
    - password
    - userName
    type: object
  dto.LoginResponse:
    properties:
      expires_in:
        description: token过期时间（秒）
        example: 86400
        type: integer
      refresh_token:
        description: 刷新token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token:
        description: 访问token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      token:
        description: 用户token
        example: abc123
        type: string
    required:
    - token
    type: object
  dto.PermissionResponse:
    properties:
      children:
        description: 子权限
        items:
          $ref: '#/definitions/dto.PermissionResponse'
        type: array
      code:
        description: 权限编码
        type: string
      component:
        description: 组件路径
        type: string
      created_at:
        description: 创建时间
        type: string
      description:
        description: 权限描述
        type: string
      icon:
        description: 图标
        type: string
      id:
        description: 权限ID
        type: integer
      name:
        description: 权限名称
        type: string
      parent_id:
        description: 父级ID
        type: integer
      path:
        description: 路由路径
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态
        type: integer
      type:
        description: 权限类型
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        description: 刷新token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  dto.RoleResponse:
    properties:
      code:
        description: 角色编码
        type: string
      created_at:
        description: 创建时间
        type: string
      description:
        description: 角色描述
        type: string
      id:
        description: 角色ID
        type: integer
      name:
        description: 角色名称
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态：0-禁用，1-启用
        type: integer
      updated_at:
        description: 更新时间
        type: string
    type: object
  dto.UpdateRoleRequest:
    properties:
      code:
        description: 角色编码
        type: string
      description:
        description: 角色描述
        type: string
      id:
        description: 角色ID
        type: integer
      name:
        description: 角色名称
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态：0-禁用，1-启用
        type: integer
    required:
    - code
    - id
    - name
    type: object
  dto.UpdateUserRequest:
    properties:
      avatar:
        description: 头像
        type: string
      email:
        description: 邮箱
        type: string
      id:
        description: 用户ID
        type: integer
      phone:
        description: 手机号
        type: string
      remark:
        description: 备注
        type: string
      role_ids:
        description: 角色ID列表
        items:
          type: integer
        type: array
      status:
        description: 状态：0-禁用，1-启用
        type: integer
      user_id:
        description: 用户ID
        type: string
      username:
        description: 用户名
        type: string
    required:
    - id
    - user_id
    - username
    type: object
  dto.UserListResponse:
    properties:
      list:
        description: 用户列表
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
      total:
        description: 总数
        type: integer
    type: object
  dto.UserResponse:
    properties:
      avatar:
        description: 头像
        type: string
      created_at:
        description: 创建时间
        type: string
      email:
        description: 邮箱
        type: string
      id:
        description: 用户ID
        type: integer
      last_login:
        description: 最后登录时间
        type: string
      login_count:
        description: 登录次数
        type: integer
      phone:
        description: 手机号
        type: string
      remark:
        description: 备注
        type: string
      roles:
        description: 角色列表
        items:
          type: string
        type: array
      status:
        description: 状态：0-禁用，1-启用
        type: integer
      updated_at:
        description: 更新时间
        type: string
      user_id:
        description: 用户ID
        type: string
      username:
        description: 用户名
        type: string
    type: object
  handle.Response:
    properties:
      errCode:
        description: 响应码，0表示成功
        example: 0
        type: integer
      errMsg:
        description: 响应消息
        example: ok
        type: string
      result:
        description: 响应数据
        type: object
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8089
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Go Web后台管理框架API文档
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go Web Admin API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: 用户登录接口
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 用户登录
      tags:
      - 基础接口
  /logout:
    post:
      consumes:
      - application/json
      description: 用户登出接口
      parameters:
      - description: 登出请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/handle.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 基础接口
  /permission:
    get:
      consumes:
      - application/json
      description: 获取权限树形列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.PermissionResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取权限列表
      tags:
      - 权限管理
    post:
      consumes:
      - application/json
      description: 创建新权限
      parameters:
      - description: 创建权限请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PermissionResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 创建权限
      tags:
      - 权限管理
  /permission/{id}:
    delete:
      consumes:
      - application/json
      description: 删除权限
      parameters:
      - description: 权限ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handle.Response'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 删除权限
      tags:
      - 权限管理
    get:
      consumes:
      - application/json
      description: 根据权限ID获取权限详情
      parameters:
      - description: 权限ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PermissionResponse'
              type: object
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 获取权限详情
      tags:
      - 权限管理
    put:
      consumes:
      - application/json
      description: 更新权限信息
      parameters:
      - description: 权限ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新权限请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PermissionResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 更新权限
      tags:
      - 权限管理
  /refresh:
    post:
      consumes:
      - application/json
      description: 使用刷新token获取新的访问token
      parameters:
      - description: 刷新token请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 刷新token无效
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 刷新token
      tags:
      - 基础接口
  /role:
    get:
      consumes:
      - application/json
      description: 获取所有角色列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.RoleResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取角色列表
      tags:
      - 角色管理
    post:
      consumes:
      - application/json
      description: 创建新角色
      parameters:
      - description: 创建角色请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RoleResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 创建角色
      tags:
      - 角色管理
  /role/{id}:
    delete:
      consumes:
      - application/json
      description: 删除角色
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handle.Response'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 删除角色
      tags:
      - 角色管理
    get:
      consumes:
      - application/json
      description: 根据角色ID获取角色详情
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RoleResponse'
              type: object
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 获取角色详情
      tags:
      - 角色管理
    put:
      consumes:
      - application/json
      description: 更新角色信息
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新角色请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RoleResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 更新角色
      tags:
      - 角色管理
  /user:
    get:
      consumes:
      - application/json
      description: 分页获取用户列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 用户名（模糊搜索）
        in: query
        name: username
        type: string
      - description: 状态筛选
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserListResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 创建新用户
      parameters:
      - description: 创建用户请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户管理
  /user/{id}:
    delete:
      consumes:
      - application/json
      description: 删除用户
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handle.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户管理
    get:
      consumes:
      - application/json
      description: 根据用户ID获取用户详情
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 获取用户详情
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      description: 更新用户信息
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新用户请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 更新用户
      tags:
      - 用户管理
  /user/change-password:
    post:
      consumes:
      - application/json
      description: 修改当前用户密码
      parameters:
      - description: 修改密码请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            $ref: '#/definitions/handle.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 用户管理
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
