externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8089
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a daily news reboot server API documentation.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Daily News Reboot API
  version: "1.0"
paths:
  /alarmCategory/saveAlarmCategory:
    post:
      consumes:
      - application/json
      description: 保存新的告警分类信息
      parameters:
      - description: 告警分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SaveAlarmCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 保存成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AlarmCategory'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 保存告警分类
      tags:
      - 告警分类
  /alarmManage/saveAlarmManage:
    post:
      consumes:
      - application/json
      description: 保存新的报警管理信息
      parameters:
      - description: 报警管理信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SaveAlarmManageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 保存成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AlarmManage'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 保存报警管理
      tags:
      - 报警管理
  /alarmManage/updateAlarmManage:
    post:
      consumes:
      - application/json
      description: 更新已有的报警管理信息
      parameters:
      - description: 报警管理更新信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAlarmManageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AlarmManage'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 更新报警管理
      tags:
      - 报警管理
  /deviceList/saveDeviceList:
    post:
      consumes:
      - application/json
      description: 保存新的设备信息
      parameters:
      - description: 设备信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SaveDeviceListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 保存成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.DeviceList'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 保存设备信息
      tags:
      - 设备管理
  /login:
    post:
      consumes:
      - application/json
      description: 用户登录接口
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 用户登录
      tags:
      - 基础接口
  /logout:
    post:
      consumes:
      - application/json
      description: 用户登出接口
      parameters:
      - description: 登出请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/handle.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 基础接口
  /mainModule/delMediaConfig/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除媒体配置
      parameters:
      - description: 媒体配置ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handle.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 删除媒体配置
      tags:
      - 媒体配置
  /mainModule/getMediaConfig/{id}:
    get:
      consumes:
      - application/json
      description: 根据ID获取媒体配置的详细信息
      parameters:
      - description: 媒体配置ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.MediaConfig'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 获取媒体配置详情
      tags:
      - 媒体配置
  /mainModule/getMediaConfigPage:
    get:
      consumes:
      - application/json
      description: 分页获取媒体配置列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.MediaConfigPageResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 分页获取媒体配置
      tags:
      - 媒体配置
  /mainModule/saveMediaConfig:
    post:
      consumes:
      - application/json
      description: 保存新的媒体配置信息
      parameters:
      - description: 媒体配置信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SaveMediaConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 保存成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.MediaConfig'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 保存媒体配置
      tags:
      - 媒体配置
  /mainModule/updateMediaConfig:
    post:
      consumes:
      - application/json
      description: 更新已有的媒体配置信息
      parameters:
      - description: 媒体配置更新信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMediaConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.MediaConfig'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/handle.Response'
      security:
      - BearerAuth: []
      summary: 更新媒体配置
      tags:
      - 媒体配置
  /modelsInfo/getModelsInfo/{id}:
    get:
      consumes:
      - application/json
      description: 根据模型ID获取详细信息
      parameters:
      - description: 模型ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/handle.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ModelsInfoResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/handle.Response'
      summary: 根据ID获取模型信息
      tags:
      - 模型信息
  /modelsInfo/getModelsInfoAll:
    get:
      consumes:
      - application/json
      description: 获取系统中所有的模型信息列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
