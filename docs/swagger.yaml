        description: 分类
        type: string
      date_time:
        description: 日期时间
        type: string
      description:
        description: 描述
        type: string
      id:
        type: integer
      name:
        description: 模型名称
        type: string
      sophon_type:
        description: Sophon类型
        type: integer
      specialty:
        description: 专业性
        type: integer
    type: object
  model.ParamConf:
    properties:
      id:
        type: integer
      key:
        description: 配置键
        type: string
      param:
        description: 参数名称
        type: string
      param_value:
        description: 参数值
        type: string
    type: object
  model.PlanTemplate:
    properties:
      id:
        type: integer
      name:
        type: string
      plan:
        type: string
    type: object
  model.TaskManage:
    properties:
      alarm_interval:
        type: integer
      arit_params:
        type: string
      arithmetic_config:
        type: string
      id:
        type: integer
      media_id:
        type: integer
      media_source:
        type: string
      name:
        type: string
      plan_id:
        type: integer
      report_addr:
        type: string
      sophon_types:
        type: string
      status_desc:
        type: string
      task_status:
        type: integer
      used_ip:
        type: string
